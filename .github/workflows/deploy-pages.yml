name: Deploy main, beta and noammo to GitHub Pages

on:
  push:
    branches:
      - main
      - beta
      - noammo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: source/main

      - name: Checkout beta
        uses: actions/checkout@v6
        with:
          ref: beta
          path: source/beta

      - name: Checkout noammo
        uses: actions/checkout@v6
        with:
          ref: noammo
          path: source/noammo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble main, beta and noammo sites
        run: |
          mkdir -p _site/beta _site/noammo
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='.gitattributes' \
            --exclude='package*.json' \
            --exclude='README.md' \
            --exclude='REGRESSION_TESTS.md' \
            source/main/ _site/
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='.gitattributes' \
            --exclude='package*.json' \
            --exclude='README.md' \
            --exclude='REGRESSION_TESTS.md' \
            source/beta/ _site/beta/
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='.gitattributes' \
            --exclude='package*.json' \
            --exclude='README.md' \
            --exclude='REGRESSION_TESTS.md' \
            --exclude='PLANNED_CONTENT.md' \
            source/noammo/ _site/noammo/
          # Serve the new opening at /noammo/, not the branch's legacy index.
          # Its link back to the mining game should reach stable main at /.
          sed -i 's|href="index.html"|href="../"|g' _site/noammo/noammo.html
          cp _site/noammo/noammo.html _site/noammo/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
