name: Deploy main and beta to GitHub Pages

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: source/main

      - name: Checkout beta
        uses: actions/checkout@v6
        with:
          ref: beta
          path: source/beta

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble main and beta sites
        run: |
          mkdir -p _site/beta
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='.gitattributes' \
            --exclude='package*.json' \
            --exclude='README.md' \
            --exclude='REGRESSION_TESTS.md' \
            source/main/ _site/
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='.gitattributes' \
            --exclude='package*.json' \
            --exclude='README.md' \
            --exclude='REGRESSION_TESTS.md' \
            source/beta/ _site/beta/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
